<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f6f1e7" />
    <title>Portfolio Admin</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="admin.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div id="loginView" class="login-view">
      <form id="loginForm" class="login-card" autocomplete="on">
        <div class="login-mark">OB</div>
        <h1>Portfolio Admin</h1>
        <p class="muted">Sign in to manage messages and site content.</p>

        <label class="field">
          <span>Username</span>
          <input name="username" type="text" autocomplete="username" required />
        </label>

        <label class="field">
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password" required />
        </label>

        <button type="submit" class="btn primary block" id="loginBtn">Sign in</button>
        <p class="form-error" id="loginError" role="alert" hidden></p>
        <a class="back-link" href="index.html"><i class="fas fa-arrow-left"></i> Back to site</a>
      </form>
    </div>

    <div id="appView" class="app" hidden>
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-dot"></span>
          <div>
            <strong>Oumar Bagayoko</strong>
            <small>Portfolio admin</small>
          </div>
        </div>

        <nav class="side-nav" id="sideNav">
          <button type="button" data-view="messages">
            <i class="fas fa-inbox"></i> Inbox <span class="badge" id="unreadBadge">0</span>
          </button>
          <p class="nav-label">Site content</p>
          <button type="button" data-view="profile"><i class="fas fa-user"></i> Profile &amp; About</button>
          <button type="button" data-view="skills"><i class="fas fa-layer-group"></i> Skills</button>
          <button type="button" data-view="education"><i class="fas fa-graduation-cap"></i> Education</button>
          <button type="button" data-view="experience"><i class="fas fa-briefcase"></i> Experience</button>
          <button type="button" data-view="languages"><i class="fas fa-language"></i> Languages</button>
          <button type="button" data-view="certifications"><i class="fas fa-certificate"></i> Certifications</button>
          <button type="button" data-view="links"><i class="fas fa-link"></i> Links &amp; Footer</button>
        </nav>

        <div class="sidebar-footer">
          <a href="index.html" target="_blank" rel="noopener"><i class="fas fa-external-link-alt"></i> View site</a>
          <button type="button" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sign out</button>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <h1 id="viewTitle">Inbox</h1>
            <p id="viewSubtitle" class="muted"></p>
          </div>
          <span class="save-state" id="saveState"></span>
        </header>

        <section class="view" id="messagesView">
          <div class="filters" id="messageFilters">
            <button type="button" data-filter="all" class="chip active">All</button>
            <button type="button" data-filter="unread" class="chip">Unread</button>
            <button type="button" data-filter="read" class="chip">Read</button>
            <button type="button" data-filter="archived" class="chip">Archived</button>
            <button type="button" class="chip ghost" id="refreshMessages"><i class="fas fa-rotate"></i> Refresh</button>
          </div>
          <div id="messagesList" class="messages-list"></div>
        </section>

        <section class="view" id="editorView" hidden>
          <div id="editorForm" class="editor-form"></div>
          <div class="editor-actions">
            <button type="button" class="btn primary" id="saveContentBtn">
              <i class="fas fa-floppy-disk"></i> Save changes
            </button>
            <button type="button" class="btn ghost" id="resetSectionBtn">
              <i class="fas fa-undo"></i> Reset section
            </button>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" hidden></div>
    <script src="admin.js" defer></script>
  </body>
</html>
